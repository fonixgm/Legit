<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legit?</title>
<meta name="description" content="Paste a suspicious message and find out in a second if it is a scam.">
<meta name="theme-color" content="#f6f4ef">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* Type is the interface: a huge light serif for the verdict, a tight grotesk for everything else.
     No cards, no rounded boxes. Colour is spent only on the verdict. */
  :root {
    --bg: #f2eee4; --ink: #111110; --muted: #5d5b53; --line: #111110;
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
    --sans: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
    --red: #d62718; --on-red: #fff; --yellow: #ffcf33; --on-yellow: #111110; --green: #0f6b3a; --on-green: #fff;
    --focus: #1a56db;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --ink: #f2eee4; --muted: #a8a69e; --line: #f2eee4; --focus: #8ab4ff; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
  body { margin: 0; overflow-x: clip; background: var(--bg); color: var(--ink); font: 400 20px/1.45 var(--sans); }
  main { max-width: 1100px; margin: 0 auto; padding: 18px clamp(16px, 4vw, 40px) 56px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 16px; }
  .brand { font: 500 18px/1 var(--sans); letter-spacing: .02em; }
  .lang { display: flex; gap: 14px; }
  .lang button { font: inherit; font-size: 16px; padding: 6px 0; cursor: pointer; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); }
  .lang button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }

  h1 { font: 300 clamp(54px, 15.5vw, 190px)/.92 var(--serif); letter-spacing: -.035em; margin: clamp(28px, 7vw, 80px) 0 18px; font-variation-settings: "opsz" 144; }
  .tagline { font-size: clamp(20px, 3vw, 28px); line-height: 1.25; color: var(--muted); max-width: 22em; margin: 0 0 clamp(24px, 5vw, 48px); }

  label { display: block; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 170px; padding: 8px 0 14px; resize: vertical; display: block;
    font: 300 clamp(26px, 4.4vw, 44px)/1.15 var(--serif); letter-spacing: -.01em; color: var(--ink);
    background: none; border: 0; border-bottom: 3px solid var(--line); border-radius: 0;
  }
  textarea::placeholder { color: color-mix(in srgb, var(--ink) 30%, transparent); }
  textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  button.big {
    flex: 1 1 220px; min-height: 64px; font: 700 22px/1 var(--sans); letter-spacing: .01em;
    cursor: pointer; border: 3px solid var(--ink); border-radius: 0; background: var(--ink); color: var(--bg);
  }
  button.big.ghost { flex: 0 0 auto; background: none; color: var(--ink); padding: 0 24px; font-weight: 500; }
  button.big.shot { flex: 1 1 100%; }
  .shotnote { margin: 12px 0 0; font-size: 16px; color: var(--muted); }
  body.dragging textarea { outline: 3px dashed var(--ink); outline-offset: 4px; }
  button.big:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
  button:disabled { opacity: .55; cursor: wait; }
  .examples { margin-top: 20px; font-size: 17px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; }
  .examples button { font: inherit; font-size: 17px; padding: 2px 0; cursor: pointer; background: none; color: var(--ink); border: 0; border-bottom: 2px solid var(--ink); }

  /* The verdict takes the whole width of the screen. */
  #result { margin-top: clamp(36px, 7vw, 80px); width: 100vw; margin-left: calc(50% - 50vw); padding: clamp(28px, 6vw, 72px) 0 clamp(36px, 6vw, 72px); }
  #result[hidden] { display: none; }
  #result > .inner { max-width: 1100px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
  #result.red { background: var(--red); color: var(--on-red); --line: var(--on-red); --ink: var(--on-red); --bg: var(--red); --muted: color-mix(in srgb, var(--on-red) 80%, transparent); }
  #result.yellow { background: var(--yellow); color: var(--on-yellow); --line: var(--on-yellow); --ink: var(--on-yellow); --bg: var(--yellow); --muted: color-mix(in srgb, var(--on-yellow) 75%, transparent); }
  #result.green { background: var(--green); color: var(--on-green); --line: var(--on-green); --ink: var(--on-green); --bg: var(--green); --muted: color-mix(in srgb, var(--on-green) 80%, transparent); }
  #result.error { color: var(--ink); border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
  .badge { font: 300 clamp(54px, 19vw, 250px)/.88 var(--serif); letter-spacing: -.04em; margin: 0; text-transform: uppercase; font-variation-settings: "opsz" 144; overflow-wrap: anywhere; }
  .headline { font: 400 clamp(26px, 4.2vw, 46px)/1.12 var(--serif); letter-spacing: -.01em; margin: clamp(18px, 3vw, 32px) 0 0; max-width: 24em; overflow-wrap: anywhere; }
  #result.error .headline { margin-top: 0; }

  .checks { list-style: none; margin: clamp(22px, 4vw, 40px) 0 0; padding: 0; border-top: 2px solid var(--line); }
  .checks li { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 2px solid var(--line); font-size: clamp(19px, 2.6vw, 26px); }
  .checks b { font: 700 clamp(22px, 3vw, 30px)/1.1 var(--sans); text-align: right; overflow-wrap: anywhere; }
  .checks .bad b { text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 5px; }

  .msglabel { margin: clamp(22px, 4vw, 40px) 0 6px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #marked { margin: 0; max-height: 11em; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 300 clamp(20px, 2.8vw, 28px)/1.3 var(--serif); }
  #marked mark { color: inherit; padding: 0 2px; font-weight: 400; }
  #marked mark.bad { background: none; text-decoration: line-through; text-decoration-thickness: 4px; text-decoration-skip-ink: none; }
  #marked mark.ok { background: none; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }
  /* "Not sure": a wavy underline, so the link stays readable instead of being struck out. */
  #result.yellow #marked mark.bad, #result.green #marked mark.bad { text-decoration-line: underline; text-decoration-style: wavy; text-underline-offset: 5px; }

  .action { font: 400 clamp(24px, 3.4vw, 38px)/1.2 var(--serif); margin: clamp(24px, 4vw, 44px) 0 0; max-width: 26em; }
  .action strong { display: block; font: 500 15px/1 var(--sans); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; color: var(--muted); }
  #result .row { margin-top: 28px; }
  #result button.big { background: none; color: var(--ink); border-color: var(--ink); }
  #result button.big:hover:not(:disabled) { box-shadow: 4px 4px 0 var(--ink); }
  #speak[hidden], #share[hidden] { display: none; }
  details { margin-top: 28px; font-size: 17px; }
  summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
  details ul { margin: 8px 0; padding-left: 20px; }
  details li { margin: 4px 0; overflow-wrap: anywhere; }
  .meter { display: grid; grid-template-columns: minmax(0, 1fr) 90px 44px; gap: 8px; align-items: center; margin: 6px 0; }
  .bar { height: 8px; background: color-mix(in srgb, var(--ink) 20%, transparent); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .small { font-size: 14px; color: var(--muted); }
  footer { margin-top: 48px; font-size: 15px; color: var(--muted); max-width: 40em; }
  footer p { margin: 6px 0; }
  .mock { border: 2px dashed currentColor; padding: 6px 10px; font-size: 14px; margin-top: 16px; }
  @media (max-width: 520px) { .checks li { flex-direction: column; gap: 2px; } .checks b { text-align: left; } }
  @media (prefers-reduced-motion: reduce) { button.big:hover:not(:disabled) { transform: none; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">Legit?</span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="es">Español</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </header>
  <h1 data-t="h1"></h1>
  <p class="tagline" data-t="tagline"></p>

  <form id="form">
    <label for="text" data-t="label"></label>
    <textarea id="text" maxlength="4000" required autocomplete="off" spellcheck="false" data-ph="placeholder"></textarea>
    <div class="row">
      <button class="big ghost" type="button" id="paste" data-t="paste"></button>
      <button class="big" type="submit" id="go" data-t="go"></button>
    </div>
    <div class="row">
      <button class="big ghost shot" type="button" id="shot" data-t="shot"></button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <p class="shotnote" id="shotnote" hidden aria-live="polite"></p>
  </form>

  <div class="examples">
    <span data-t="try"></span>
    <button type="button" data-ex="scam" data-t="exScam"></button>
    <button type="button" data-ex="legit" data-t="exLegit"></button>
  </div>
</main>

<section id="result" hidden aria-live="polite">
  <div class="inner">
    <h2 class="badge" id="badge"></h2>
    <p class="headline" id="headline"></p>
    <ul class="checks" id="checks"></ul>
    <p class="msglabel" data-t="yourMessage"></p>
    <p id="marked"></p>
    <p class="action"><strong data-t="whatToDo"></strong><span id="action"></span></p>
    <div class="row">
      <button class="big" type="button" id="speak" data-t="speak"></button>
      <button class="big" type="button" id="share" data-t="share"></button>
    </div>
    <details id="why">
      <summary data-t="why"></summary>
      <ul id="reasons"></ul>
      <div id="meters"></div>
      <p class="small" id="meta"></p>
    </details>
    <p class="mock" id="mock" hidden data-t="mock"></p>
  </div>
</section>

<main>
  <footer>
    <p data-t="privacy"></p>
    <p data-t="limits"></p>
  </footer>
</main>

    shareText: "Can you look at this? I got this message:\n\n“{text}”\n\nLegit? says: {badge}. {headline}",

      scam: "Chase: Unusual sign-in detected. Your account will be locked in 24h. Verify your identity now: https://chase-secure-verify.com/login",
      legit: "Chase: You made a $23.90 purchase at TARGET with card ending 4821. If you don't recognize it, review your activity in the Chase app.",
    },
  },
};

const $ = (id) => document.getElementById(id);
const fill = (s, p = {}) => s.replace(/\{(\w+)\}/g, (_, k) => p[k] ?? "");
let lang = "en";
let last = null; // last result, so a language switch can re-render it

function pickLang() {
  try { const saved = localStorage.getItem("lang"); if (I18N[saved]) return saved; } catch {}
  // Spanish if ANY of the browser's preferred languages is one spoken in Spain or Latin
  // America (many people keep the phone in English or Catalan); English for everyone else.
  const prefs = (navigator.languages?.length ? navigator.languages : [navigator.language || "en"]).map((l) => l.toLowerCase());
  return prefs.some((l) => /^(es|ca|gl|eu)\b/.test(l)) ? "es" : "en";
}

function setLang(next) {
  lang = next;
  document.documentElement.lang = lang;
  try { localStorage.setItem("lang", lang); } catch {}
  const t = I18N[lang];
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll("[data-ph]").forEach((el) => { el.placeholder = t[el.dataset.ph]; });
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (last) render(last);
}

function reasonText(r) {
  const t = I18N[lang];
  let code = r.code;
  if (code === "lookalike" && !r.brand) code = "lookalike_nobrand";
  return fill(t.reasons[code] ?? code, { ...r, type: t.types[r.type] ?? r.type });
}

// The user's own message, with every link marked: struck through when it is not the claimed
// brand's, underlined when it is. Built with text nodes only (the message is untrusted).
function renderMarked(data) {
  const text = data.text ?? "";
  const spots = [];
  for (const l of data.links) {
    const at = text.indexOf(l.raw);
    if (at >= 0) spots.push({ at, end: at + l.raw.length, ok: Boolean(data.own && l.kind === "official") });
  }
  spots.sort((a, b) => a.at - b.at);
  const nodes = [];
  let pos = 0;
  for (const sp of spots) {
    if (sp.at < pos) continue;
    nodes.push(document.createTextNode(text.slice(pos, sp.at)));
    const m = document.createElement("mark");
    m.className = sp.ok ? "ok" : "bad";
    m.textContent = text.slice(sp.at, sp.end);
    nodes.push(m);
    pos = sp.end;
  }
  nodes.push(document.createTextNode(text.slice(pos)));
  $("marked").replaceChildren(...nodes);
}

// Three plain questions: the whole verdict, readable without knowing anything about links.
function renderChecks(data) {
  const c = I18N[lang].checks;
  const asks = data.signals.asks >= 0.5;
  const rows = [[c.asks, asks ? c.yes : c.no, asks ? "bad" : "ok"]];
  rows.push([c.claims, data.brand ? `${c.yes}: ${data.brand}` : data.type === "family" ? c.relative : c.nobody, ""]);
  if (!data.links.length) rows.push([c.link, c.noLink, ""]);
  else if (!data.brand) rows.push([c.link, c.unknownSender, ""]);
  else {
    const theirs = data.own;
    rows.push([c.link, theirs ? c.yes : c.no, theirs ? "ok" : "bad"]);
  }
  $("checks").replaceChildren(...rows.map(([q, a, cls]) => {
    const li = document.createElement("li"); if (cls) li.className = cls;
    const qs = document.createElement("span"); qs.textContent = q;
    const as = document.createElement("b"); as.textContent = a;
    li.append(qs, as);
    return li;
  }));
}

let speaking = false;
function stopSpeaking() {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  speaking = false;
  $("speak").textContent = I18N[lang].speak;
}
function speak() {
  if (speaking) return stopSpeaking();
  if (!last || !("speechSynthesis" in window)) return;
  const t = I18N[lang];
  const u = new SpeechSynthesisUtterance([t.badge[last.verdict], reasonText(last.headline), $("action").textContent].join(". "));
  u.lang = lang === "es" ? "es-ES" : "en-US";
  u.rate = 0.9;
  u.onend = u.onerror = stopSpeaking;
  speaking = true;
  $("speak").textContent = t.stopSpeak;
  speechSynthesis.speak(u);
}

function showError(code) {
  const t = I18N[lang];
  last = null;
  const box = $("result");
  box.className = "error";
  box.hidden = false;
  $("badge").textContent = "";
  box.querySelector(".badge").hidden = true;
  $("headline").textContent = t.errors[code] ?? t.errors.unavailable;
  box.querySelector(".action").hidden = true;
  $("share").hidden = true; $("speak").hidden = true; $("marked").replaceChildren(); document.querySelectorAll(".msglabel").forEach((e) => (e.hidden = true)); $("checks").replaceChildren(); $("why").hidden = true; $("mock").hidden = true;
}

function meter(label, value, max = 1) {
  const row = document.createElement("div"); row.className = "meter";
  const name = document.createElement("span"); name.textContent = label;
  const bar = document.createElement("span"); bar.className = "bar";
  const fillEl = document.createElement("i"); fillEl.style.width = Math.round(Math.max(0, Math.min(1, value / max)) * 100) + "%";
  bar.append(fillEl);
  const num = document.createElement("span"); num.className = "num";
  num.textContent = max === 1 ? Math.round(value * 100) + "%" : value.toFixed(1) + "/" + max;
  row.append(name, bar, num);
  return row;
}

function render(data) {
  last = data;
  const t = I18N[lang];
  const box = $("result");
  box.className = data.verdict;
  box.hidden = false;
  box.querySelector(".badge").hidden = false;
  document.querySelectorAll(".msglabel").forEach((e) => (e.hidden = false));
  box.querySelector(".action").hidden = false;
  $("badge").textContent = t.word[data.verdict];
  $("headline").textContent = reasonText(data.headline);
  $("action").textContent = data.verdict === "red"
    ? (t.actions.red[data.type] ?? t.actions.red.default)
    : data.verdict === "yellow" && data.headline.code === "family_new_contact"
      ? t.actions.familyYellow
      : t.actions[data.verdict];
  $("share").hidden = false;
  $("speak").hidden = !("speechSynthesis" in window);
  $("why").hidden = false;
  stopSpeaking();
  renderChecks(data);
  renderMarked(data);

  const ul = $("reasons"); ul.replaceChildren();
  for (const r of data.reasons) { const li = document.createElement("li"); li.textContent = reasonText(r); ul.append(li); }

  const s = data.signals, m = t.meters;
  const brandLabel = s.brand.id === "none" ? m.none : s.brand.id === "other" ? m.other : (data.brand ?? s.brand.id);
  const typeLabel = s.type.id === "none" ? m.none : (t.types[s.type.id] ?? s.type.id);
  $("meters").replaceChildren(
    meter(m.asks, s.asks),
    meter(fill(m.brand, { v: brandLabel }), s.brand.p),
    meter(fill(m.type, { v: typeLabel }), s.type.p),
    meter(m.pressure, s.pressure, 3),
  );
  $("meta").textContent = fill(t.meta, { n: data.links.length, ms: data.ms });
  $("mock").hidden = !data.mock;
}

async function check() {
  const text = $("text").value.trim();
  if (!text) return showError("empty");
  const go = $("go");
  go.disabled = true; go.textContent = I18N[lang].checking;
  try {
    const res = await fetch("/api/check", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { showError(data.error ?? "unavailable"); if (data.detail) console.warn("Legit?", data.detail, data.message ?? ""); } else render({ ...data, text });
  } catch {
    showError("unavailable");
  } finally {
    go.disabled = false; go.textContent = I18N[lang].go;
    $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); check(); });
$("paste").addEventListener("click", async () => {
  // A copied screenshot comes as an image, a copied message as text.
  try {
    for (const item of await navigator.clipboard.read()) {
      const type = item.types.find((t) => t.startsWith("image/"));
      if (type) return readShot(await item.getType(type));
    }
  } catch {}
  try { const clip = await navigator.clipboard.readText(); if (clip) $("text").value = clip.slice(0, 4000); }
  catch { showError("clipboard"); $("text").focus(); }
});

// ---- Screenshots. The image never leaves the phone: the text is read here, in the browser
// (Tesseract.js), put in the box so it can be seen and corrected, and checked like any message.
const OCR_SRC = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let ocrWorker = null;
let ocrProgress = () => {};
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src; el.onload = resolve; el.onerror = () => reject(new Error("script"));
    document.head.append(el);
  });
}
async function getOcr() {
  if (!ocrWorker) {
    ocrWorker = (async () => {
      if (!window.Tesseract) await loadScript(OCR_SRC);
      return Tesseract.createWorker(["spa", "eng"], 1, { logger: (m) => ocrProgress(m) });
    })();
    ocrWorker.catch(() => { ocrWorker = null; });
  }
  return ocrWorker;
}
// Big photos are slow to read and small text reads badly: bring the image to a sane width.
async function prepareImage(blob) {
  const bmp = await createImageBitmap(blob);
  const scale = bmp.width > 1600 ? 1600 / bmp.width : bmp.width < 700 ? 2 : 1;
  if (scale === 1) return blob;
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
  canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve) => canvas.toBlob((b) => resolve(b ?? blob), "image/png"));
}
let reading = false;
async function readShot(blob) {
  if (reading || !blob) return;
  reading = true;
  const t = () => I18N[lang];
  const note = $("shotnote"), shot = $("shot"), go = $("go");
  shot.disabled = true; go.disabled = true;
  note.hidden = false; note.textContent = t().shotLoading;
  ocrProgress = (m) => { if (m.status === "recognizing text") note.textContent = fill(t().shotReading, { pct: Math.round((m.progress || 0) * 100) }); };
  try {
    const [worker, image, tidy] = await Promise.all([getOcr(), prepareImage(blob).catch(() => blob), import("/ocr-text.js")]);
    const { data } = await worker.recognize(image);
    const text = tidy.cleanOcrText(data.text || "");
    if (text.replace(/\s/g, "").length < 8) { note.textContent = t().shotEmpty; return; }
    $("text").value = text;
    note.textContent = t().shotDone;
    shot.disabled = false; go.disabled = false;
    await check();
  } catch {
    note.textContent = t().shotFail;
  } finally {
    reading = false; shot.disabled = false; go.disabled = false; $("file").value = "";
  }
}
$("shot").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => readShot(e.target.files[0]));
document.addEventListener("paste", (e) => {
  const img = [...(e.clipboardData?.files ?? [])].find((f) => f.type.startsWith("image/"));
  if (img) { e.preventDefault(); readShot(img); }
});
document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dragging"); });
document.addEventListener("dragleave", () => document.body.classList.remove("dragging"));
document.addEventListener("drop", (e) => {
  e.preventDefault(); document.body.classList.remove("dragging");
  const img = [...(e.dataTransfer?.files ?? [])].find((f) => f.type.startsWith("image/"));
  if (img) readShot(img);
});
document.querySelectorAll("[data-ex]").forEach((b) => b.addEventListener("click", () => {
  $("text").value = I18N[lang].ex[b.dataset.ex]; check();
}));
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
$("speak").addEventListener("click", speak);
$("share").addEventListener("click", async () => {
  if (!last) return;
  const t = I18N[lang];
  const text = fill(t.shareText, { text: $("text").value.trim(), badge: t.badge[last.verdict], headline: reasonText(last.headline) });
  if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e.name === "AbortError") return; } }
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener");
});

setLang(pickLang());
</script>
</body>
</html>
